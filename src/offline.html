<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>No Internet Connection</title>
  <style>
    body {
      background: transparent;
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin:0;
      -webkit-app-region: drag;
    }
    .app {
      --accent: #008069;
      background: #f7f5f3;
      color: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .icon {
      width: 64px;
      margin-bottom: 24px;
    }
    .message {
      font-size: 1.5em;
      margin-bottom: 12px;
    }
    .sub {
      font-size: 1em;
      color: #666;
    }
    .spinner {
      border-color: #ddd;
    }
    @media (prefers-color-scheme: dark) {
      .app {
        --accent: #21c063;
        background: #222;
        color: #fff;
      }
      .icon {
        filter: invert(1);
      }
      .sub {
        color: #aaa;
      }
      .spinner {
        border-color: #444;
      }
    }
  </style>
</head>
<body>
  <div class="app">
  <img src="../assets/whatsapp-symbolic.svg" class="icon"></img>
  <div class="message">No Internet Connection</div>
  <div class="sub">Please check your network and try again.</div>
  <div style="margin:32px 0 0 0;display:flex;flex-direction:row;align-items:center;gap:18px;">
    <div class="spinner" style="width:32px;height:32px;border-width:5px;border-style:solid;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;"></div>
    <div id="countdown" style="font-size:1.2em;color:var(--accent);">Retrying in <span id="seconds">10</span>s...</div>
  </div>
  <script>
    let seconds = 10;
    const secondsSpan = document.getElementById('seconds');
    setInterval(() => {
      seconds--;
      if (seconds < 0) seconds = 0;
      secondsSpan.textContent = seconds;
    }, 1000);

    window.addEventListener('poll-refresh', () => {
      seconds = 10;
      secondsSpan.textContent = seconds;
    });
  </script>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  </div>
</body>
</html>
