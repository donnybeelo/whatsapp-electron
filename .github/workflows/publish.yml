name: Publish flatpak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the release repo build
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RELEASES_TOKEN" \
            https://api.github.com/repos/donnybeelo/donnybeelo-releases/dispatches \
            -d "{\"event_type\":\"publish-electron\",\"client_payload\":{
                  \"repo\":\"$GITHUB_REPOSITORY\",
                  \"commit\":\"$GITHUB_SHA\",
                  \"label\":\"WhatsApp ${GITHUB_SHA::8}\"}}"
