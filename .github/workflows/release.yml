name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "$(git describe --tags --abbrev=0)" | head -n 1)
          CUR_TAG=$(git describe --tags --abbrev=0)
          echo "Previous tag: $PREV_TAG"
          echo "Current tag: $CUR_TAG"
          echo "Changelog:" > changelog.txt
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG..$CUR_TAG" --pretty=format:"- %s" >> changelog.txt
          else
            git log "$CUR_TAG" --pretty=format:"- %s" >> changelog.txt
          fi
          cat changelog.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build Linux AppImage
        run: bun dist:linux -- --publish=never

      - name: Build Windows distributables
        run: bun dist:windows -- --publish=never

      - name: Rename Windows executable
        run: |
          cd dist
          file=$(ls WhatsApp*.exe)
          if [[ "$file" =~ ^WhatsApp[[:space:]](.*)\.exe$ ]]; then
            newname="WhatsApp-${BASH_REMATCH[1]}.exe"
            mv "$file" "$newname"
          fi

      - name: Upload distributable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            dist/WhatsApp*.exe
            dist/WhatsApp*.AppImage
            dist/WhatsApp*-win.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WhatsApp*.exe
            dist/WhatsApp*.AppImage
            dist/WhatsApp*-win.zip
          body_path: changelog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
